<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>오웬의 철도 관제소</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><header><div><small>대한민국 철도 임무 게임</small><h1>🚦 오웬의 철도 관제소</h1></div><div class="hud"><b>⭐ <span id="score">0</span></b><b>🏅 <span id="badge">0</span></b></div></header><section class="yard"><div class="sky" id="sky">☀️　☁️　　☁️</div><div class="station"><span>🏢 창원중앙역</span><span class="clock" id="clock">10:20</span></div><div class="platform">1번 승강장</div><div class="track" id="track1"></div><div class="platform">2번 승강장</div><div class="track" id="track2"></div><div class="platform">3번 승강장</div><div class="track" id="track3"></div><div class="signals"><span>🚦</span><span id="weather">날씨: 맑음</span><span>🔔</span></div></section><section class="mission"><div class="portrait">👮‍♂️</div><div><small id="role">관제실 호출</small><h2 id="title">첫 열차가 들어옵니다!</h2><p id="story">열차와 상황을 확인하고 가장 안전한 결정을 내려주세요.</p></div></section><section id="choices" class="choices"></section><section class="bottom"><button id="announce">🔊 역 안내방송</button><button id="next" disabled>다음 임무 ➜</button></section><section class="depot"><h3>🚆 오늘 운행하는 열차</h3><div id="cards" class="cards"></div></section></main><script src="game.js"></script></body></html>
